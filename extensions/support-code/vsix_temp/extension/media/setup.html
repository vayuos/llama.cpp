<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitas Setup</title>
    <style>
        :root {
            --bg-glass: rgba(20, 20, 25, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --accent: #bb86fc;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
        }
        body {
            background-color: #0d1117;
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        h1 { color: var(--accent); margin-top: 0; }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .summary {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gravitas Setup</h1>
        
        <div id="step-1" class="step active">
            <h3>Infrastructure</h3>
            <div class="form-group">
                <label>llama-server Binary Path</label>
                <input type="text" id="llamaBinaryPath" placeholder="/usr/local/bin/llama-server">
            </div>
            <div class="form-group">
                <label>Log Directory</label>
                <input type="text" id="logDir" placeholder="./logs">
            </div>
            <div class="buttons">
                <span></span>
                <button class="btn-primary" onclick="nextStep(2)">Next: Coder Model</button>
            </div>
        </div>

        <div id="step-2" class="step">
            <h3>Coder Model (GPU Optimized)</h3>
            <div class="form-group">
                <label>Model Path (.gguf)</label>
                <input type="text" id="coderModelPath">
            </div>
            <div class="form-group">
                <label>Port</label>
                <input type="number" id="coderPort" value="8000">
            </div>
            <div class="form-group">
                <label>GPU Layers</label>
                <input type="number" id="coderGpuLayers" value="33">
            </div>
            <div class="buttons">
                <button class="btn-secondary" onclick="nextStep(1)">Back</button>
                <button class="btn-primary" onclick="nextStep(3)">Next: Reviewer Model</button>
            </div>
        </div>

        <div id="step-3" class="step">
            <h3>Reviewer Model (CPU)</h3>
            <div class="form-group">
                <label>Model Path (.gguf)</label>
                <input type="text" id="reviewerModelPath">
            </div>
            <div class="form-group">
                <label>Port</label>
                <input type="number" id="reviewerPort" value="8001">
            </div>
             <div class="form-group">
                <label>Threads</label>
                <input type="number" id="reviewerThreads" value="16">
            </div>
            <div class="buttons">
                <button class="btn-secondary" onclick="nextStep(2)">Back</button>
                <button class="btn-primary" onclick="finish()">Save & Validate</button>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        
        function nextStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step-${n}`).classList.add('active');
        }

        function finish() {
            const config = {
                llamaBinaryPath: document.getElementById('llamaBinaryPath').value,
                logDir: document.getElementById('logDir').value,
                workspaceRoot: '', // To be filled by extension
                coderModel: {
                    modelPath: document.getElementById('coderModelPath').value,
                    port: parseInt(document.getElementById('coderPort').value),
                    gpuLayers: parseInt(document.getElementById('coderGpuLayers').value),
                    ctx: 8192, batch: 512, ubatch: 512, temp: 0.1, topP: 0.95
                },
                reviewerModel: {
                    modelPath: document.getElementById('reviewerModelPath').value,
                    port: parseInt(document.getElementById('reviewerPort').value),
                    threads: parseInt(document.getElementById('reviewerThreads').value),
                    ctx: 8192, temp: 0.1
                }
            };
            vscode.postMessage({ command: 'saveConfig', config });
        }
    </script>
</body>
</html>
