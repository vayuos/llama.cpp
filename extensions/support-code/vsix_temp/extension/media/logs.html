<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitas Logs</title>
    <style>
        body {
            background: #0d1117;
            color: #e0e0e0;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            margin: 0;
            padding: 10px;
        }

        .log-line {
            margin-bottom: 2px;
            white-space: pre-wrap;
            border-radius: 2px;
            padding: 2px 5px;
        }

        .level-info {
            color: #88c0d0;
        }

        .level-warn {
            color: #ebcb8b;
            background: rgba(235, 203, 139, 0.1);
        }

        .level-error {
            color: #bf616a;
            background: rgba(191, 97, 106, 0.1);
        }

        .source {
            font-weight: bold;
            margin-right: 5px;
            opacity: 0.8;
        }

        .timestamp {
            color: #666;
            margin-right: 5px;
        }

        #controls {
            position: sticky;
            top: 0;
            background: #0d1117;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #333;
            color: #ccc;
            border: 1px solid #444;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 3px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <div id="controls">
        <button onclick="clearLogs()">Clear</button>
        <span id="filter-container">
            Filter: <input type="text" id="filter" oninput="applyFilter()" placeholder="source or text..."
                style="background:#222; color:white; border:1px solid #444;">
        </span>
    </div>
    <div id="log-container"></div>

    <script>
        const logContainer = document.getElementById('log-container');
        const filterInput = document.getElementById('filter');

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'addLog') {
                addLogEntry(message.entry);
            }
        });

        function addLogEntry(entry) {
            const line = document.createElement('div');
            line.className = `log-line level-${entry.level}`;
            line.setAttribute('data-source', entry.source);

            const ts = document.createElement('span');
            ts.className = 'timestamp';
            ts.innerText = entry.timestamp.split('T')[1].split('Z')[0];

            const src = document.createElement('span');
            src.className = 'source';
            src.innerText = `[${entry.source.toUpperCase()}]`;

            const msg = document.createElement('span');
            msg.innerText = entry.message;

            line.appendChild(ts);
            line.appendChild(src);
            line.appendChild(msg);

            logContainer.appendChild(line);

            if (logContainer.children.length > 1000) {
                logContainer.removeChild(logContainer.firstChild);
            }

            window.scrollTo(0, document.body.scrollHeight);
            applyFilter();
        }

        function clearLogs() { logContainer.innerHTML = ''; }

        function applyFilter() {
            const filter = filterInput.value.toLowerCase();
            const lines = logContainer.getElementsByClassName('log-line');
            for (let line of lines) {
                const text = line.innerText.toLowerCase();
                line.style.display = text.includes(filter) ? 'block' : 'none';
            }
        }
    </script>
</body>

</html>
